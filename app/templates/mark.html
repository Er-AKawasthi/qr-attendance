<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mark Attendance - AI Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="mark-page light-theme">
    <div class="mobile-container">
        <header class="mobile-header">
            <h1>📱 Mark Attendance</h1>
            <p>AI Tools for Research</p>
        </header>

        <main class="mobile-main card">
            <div id="status-area" class="status-area"></div>

            <form id="attendance-form" class="attendance-form">
                <input type="hidden" id="token" name="token" value="{{ token }}">
                
                <div class="form-group">
                    <label for="roll_number">Roll Number</label>
                    <input type="text" id="roll_number" name="roll_number" placeholder="e.g. IIT2024001" required autocomplete="off" autocorrect="off" spellcheck="false" class="uppercase-input">
                </div>

                <div id="name-group" class="form-group hidden slide-down">
                    <label for="name">Full Name <span class="badge">First time</span></label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name">
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-large">
                    <span class="btn-text">Mark Present</span>
                    <div class="spinner hidden"></div>
                </button>
            </form>
            
            <div id="success-view" class="success-view hidden">
                <div class="success-animation">
                    <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                        <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                        <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                    </svg>
                </div>
                <h2>Attendance Marked!</h2>
                <p id="success-name" class="success-name"></p>
                <p>You can now close this page.</p>
            </div>
        </main>
        
        <footer class="mobile-footer">
            <p>IIIT Allahabad • QR Attendance</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('attendance-form');
            const statusArea = document.getElementById('status-area');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = submitBtn.querySelector('.btn-text');
            const spinner = submitBtn.querySelector('.spinner');
            const nameGroup = document.getElementById('name-group');
            const nameInput = document.getElementById('name');
            const successView = document.getElementById('success-view');
            const successName = document.getElementById('success-name');

            const rollInput = document.getElementById('roll_number');
            rollInput.addEventListener('input', function() {
                this.value = this.value.toUpperCase();
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                submitBtn.disabled = true;
                btnText.classList.add('hidden');
                spinner.classList.remove('hidden');
                statusArea.innerHTML = '';
                statusArea.className = 'status-area';

                const payload = {
                    token: document.getElementById('token').value,
                    roll_number: rollInput.value
                };

                if (!nameGroup.classList.contains('hidden') && nameInput.value) {
                    payload.name = nameInput.value;
                }

                try {
                    const response = await fetch('/api/mark', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();

                    if (data.status === 'success') {
                        form.classList.add('hidden');
                        successView.classList.remove('hidden');
                        successName.textContent = data.name || rollInput.value;
                    } else if (data.status === 'already_marked') {
                        showStatus(data.message || 'Attendance already marked!', 'info');
                    } else if (data.needs_registration) {
                        nameGroup.classList.remove('hidden');
                        nameInput.required = true;
                        nameInput.focus();
                        showStatus('First time? Please enter your name to register.', 'info');
                    } else {
                        showStatus(data.error || data.message || 'Failed to mark attendance. QR may have expired — scan again.', 'error');
                    }
                } catch (error) {
                    showStatus('Network error. Please check your connection and try again.', 'error');
                } finally {
                    submitBtn.disabled = false;
                    btnText.classList.remove('hidden');
                    spinner.classList.add('hidden');
                }
            });

            function showStatus(message, type) {
                statusArea.textContent = message;
                statusArea.className = `status-area ${type} slide-down`;
            }
        });
    </script>
</body>
</html>
